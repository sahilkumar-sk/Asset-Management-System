<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AMS Portal – Register</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="css/auth.css">

  <!-- Libs -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
  <div class="shell">
    <!-- LEFT: form card -->
    <div class="left">
      <div class="card">
        <div class="brand">
          <h1>AMS Portal</h1>
          <p>Asset Management System</p>
          <div class="divider"></div>
        </div>

        <div class="section-title">Create an Account</div>

        <form id="registerForm" novalidate style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
          <div>
            <label for="first">First name</label>
            <input id="first" name="FirstName" type="text" placeholder="Enter First Name" required />
          </div>
          <div>
            <label for="last">Last name</label>
            <input id="last" name="LastName" type="text" placeholder="Enter Last Name" required />
          </div>
          <div>
            <label for="email">Email id</label>
            <input id="email" name="Email" type="email" placeholder="you@example.com" required />
          </div>
          <div>
            <label for="phone">Phone Number</label>
            <input id="phone" name="number" type="tel" placeholder="Enter Phone number" />
          </div>
          <div>
            <label for="pass1">New Password</label>
            <input id="pass1" name="new_password" type="password" placeholder="Create new password" minlength="6" required />
          </div>
          <div>
            <label for="pass2">Re-enter Password</label>
            <input id="pass2" name="re_password" type="password" placeholder="Re-enter new password" minlength="6" required />
          </div>

          <div style="grid-column:1/-1">
            <button type="submit">Get Started</button>
            <div class="helper">Already have an Account? <a class="link" href="login.html">Login</a></div>
          </div>
        </form>
      </div>
    </div>

    <!-- RIGHT: image mosaic -->
    <div class="gallery" aria-hidden="true">
      <div class="tile" style="background-image:url('https://images.unsplash.com/photo-1503387762-592deb58ef4e?q=80&w=1200&auto=format&fit=crop');"></div>
      <div class="tile" style="background-image:url('https://images.unsplash.com/photo-1509395176047-4a66953fd231?q=80&w=1200&auto=format&fit=crop');"></div>
      <div class="tile" style="background-image:url('https://images.unsplash.com/photo-1593642634443-44adaa06623a?q=80&w=1200&auto=format&fit=crop');"></div>

      <div class="tile" style="background-image:url('https://images.unsplash.com/photo-1519389950473-47ba0277781c?q=80&w=1200&auto=format&fit=crop');"></div>
      <div class="tile" style="background-image:url('https://images.unsplash.com/photo-1553877522-43269d4ea984?q=80&w=1200&auto=format&fit=crop');"></div>
      <div class="tile" style="background-image:url('https://images.unsplash.com/photo-1505691938895-1758d7feb511?q=80&w=1200&auto=format&fit=crop');"></div>


      <div class="tile" style="background-image:url('https://images.unsplash.com/photo-1524758631624-e2822e304c36?q=80&w=1200&auto=format&fit=crop');"></div>
      <div class="tile" style="background-image:url('https://images.unsplash.com/photo-1520607162513-77705c0f0d4a?q=80&w=1200&auto=format&fit=crop');"></div>
      <div class="tile" style="background-image:url('https://images.unsplash.com/photo-1498050108023-c5249f4df085?q=80&w=1200&auto=format&fit=crop');"></div>
    </div>

  </div>

  <script>const API='http://localhost:5000';</script>
  <script src="js/session.js"></script>
  <script>redirectIfAuthed();</script>
  <script src="js/register.js"></script>
  <script src="js/config.js"></script>
</body>

</html>
