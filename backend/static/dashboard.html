<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard | AMS</title>
  <link rel="stylesheet" href="css/ams-theme.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>

<body>
  <header class="top-nav">
    <div class="logo">AMS</div>
    <nav>
      <a href="dashboard.html" class="active">Dashboard</a>
      <a href="assets.html">Assets</a>
      <a href="employees.html">Employees</a>
      <a href="locations.html">Locations</a>
      <a href="#" id="logout">Logout</a>
    </nav>
  </header>

  <main class="dashboard-container">
    <div class="dashboard-header">
      <h1>Asset Management Dashboard</h1>
      <div class="actions">
        <input type="date" id="dateFrom" />
        <input type="date" id="dateTo" />
        <button id="btnRefresh">Refresh</button>
      </div>
    </div>

    <!-- KPI Cards -->
    <div class="kpi-row">
      <div class="kpi-card"><h3>Total Assets</h3><span id="kpiTotal">0</span></div>
      <div class="kpi-card"><h3>Assigned Assets</h3><span id="kpiAssigned">0</span></div>
      <div class="kpi-card"><h3>Unassigned Assets</h3><span id="kpiUnassigned">0</span></div>
      <div class="kpi-card"><h3>Under Maintenance</h3><span id="kpiMaint">0</span></div>
      <div class="kpi-card"><h3>Damaged</h3><span id="kpiDamaged">0</span></div>
    </div>

    <!-- Charts -->
    <div class="charts-grid">
      <div class="chart-box">
        <h3>Assets by Category & Status</h3>
        <canvas id="chartByCategory"></canvas>
      </div>
      <div class="chart-box">
        <h3>Status Distribution</h3>
        <canvas id="chartStatus"></canvas>
      </div>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/session.js"></script>
  <script>requireAuth();</script>
  <script src="js/dashboard.js"></script>

  <script>
    document.getElementById('logout').addEventListener('click', e => {
      e.preventDefault(); clearAuth(); location.href = 'login.html';
    });
  </script>
</body>
</html>
