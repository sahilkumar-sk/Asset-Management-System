<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AMS Portal – Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/auth.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
  <div class="shell">
    <div class="left">
      <div class="card">
        <div class="brand">
          <h1>AMS Portal</h1>
          <p>Asset Management System</p>
          <div class="divider"></div>
        </div>

        <div class="section-title">Login</div>

        <form id="loginForm" novalidate style="display:grid;gap:14px">
          <div>
            <label for="email">Email id</label>
            <input id="email" name="Email" type="email" placeholder="you@example.com" required />
          </div>
          <div>
            <label for="pass">Password</label>
            <input id="pass" name="password" type="password" placeholder="Password" required />
          </div>

          <div class="row">
            <label class="remember">
              <input type="checkbox" id="remember" /> Remember Me
            </label>
            <small><a class="link" href="#" title="Coming soon">Forgot Password?</a></small>
          </div>

          <button type="submit">Login</button>
          <div class="helper">Don’t have an Account? <a class="link" href="register.html">Create an Account</a></div>
        </form>
      </div>
    </div>

    <div class="gallery" aria-hidden="true">
      <div class="mosaic">
        <div class="tile t1" style="background-image:url('https://images.unsplash.com/photo-1518779578993-ec3579fee39f?q=80&w=1200&auto=format&fit=crop')"></div>
        <div class="tile"     style="background-image:url('https://images.unsplash.com/photo-1560179707-f14e90ef1f22?q=80&w=1200&auto=format&fit=crop')"></div>
        <div class="tile"     style="background-image:url('https://images.unsplash.com/photo-1517433456452-f9633a875f6f?q=80&w=1200&auto=format&fit=crop')"></div>
        <div class="tile t2"  style="background-image:url('https://images.unsplash.com/photo-1498050108023-c5249f4df085?q=80&w=1200&auto=format&fit=crop')"></div>
        <div class="tile"     style="background-image:url('https://images.unsplash.com/photo-1498050108023-c5249f4df085?q=80&w=1200&auto=format&fit=crop');filter:brightness(.9)"></div>
        <div class="tile"     style="background-image:url('https://images.unsplash.com/photo-1587614382346-4ec1b1f6a7d0?q=80&w=1200&auto=format&fit=crop')"></div>
      </div>
    </div>
  </div>
  <script>const API='http://localhost:8000';</script>
  <script src="js/session.js"></script>
  <script>redirectIfAuthed();</script>
  <script src="js/login.js"></script>
</body>
</html>
