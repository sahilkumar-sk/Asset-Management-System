<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AMS Portal – Register</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="css/auth.css">

  <!-- Libs -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
  <div class="shell">
    <div class="left">
      <div class="card">
        <div class="brand">
          <h1>AMS Portal</h1>
          <p>Asset Management System</p>
          <div class="divider"></div>
        </div>

        <div class="section-title">Create an Account</div>

        <form id="registerForm" novalidate style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
          <div>
            <label for="first">First name</label>
            <input id="first" name="FirstName" type="text" placeholder="Enter First Name" required />
          </div>
          <div>
            <label for="last">Last name</label>
            <input id="last" name="LastName" type="text" placeholder="Enter Last Name" required />
          </div>
          <div>
            <label for="email">Email id</label>
            <input id="email" name="Email" type="email" placeholder="you@example.com" required />
          </div>
          <div>
            <label for="phone">Phone Number</label>
            <input id="phone" name="number" type="tel" placeholder="Enter Phone number" />
          </div>
          <div>
            <label for="pass1">New Password</label>
            <input id="pass1" name="new_password" type="password" placeholder="Create new password" minlength="6" required />
          </div>
          <div>
            <label for="pass2">Re-enter Password</label>
            <input id="pass2" name="re_password" type="password" placeholder="Re-enter new password" minlength="6" required />
          </div>

          <div style="grid-column:1/-1;display:flex;flex-direction:column;gap:10px">
            <button type="submit">Get Started</button>
            <div class="helper">Already have an Account? <a class="link" href="login.html">Login</a></div>
          </div>
        </form>
      </div>
    </div>

    <div class="gallery" aria-hidden="true">
      <div class="mosaic">
        <div class="tile t1" style="background-image:url('https://images.unsplash.com/photo-1518779578993-ec3579fee39f?q=80&w=1200&auto=format&fit=crop')"></div>
        <div class="tile"     style="background-image:url('https://images.unsplash.com/photo-1560179707-f14e90ef1f22?q=80&w=1200&auto=format&fit=crop')"></div>
        <div class="tile"     style="background-image:url('https://images.unsplash.com/photo-1517433456452-f9633a875f6f?q=80&w=1200&auto=format&fit=crop')"></div>
        <div class="tile t2"  style="background-image:url('https://images.unsplash.com/photo-1498050108023-c5249f4df085?q=80&w=1200&auto=format&fit=crop')"></div>
        <div class="tile"     style="background-image:url('https://images.unsplash.com/photo-1498050108023-c5249f4df085?q=80&w=1200&auto=format&fit=crop');filter:brightness(.9)"></div>
        <div class="tile"     style="background-image:url('https://images.unsplash.com/photo-1587614382346-4ec1b1f6a7d0?q=80&w=1200&auto=format&fit=crop')"></div>
      </div>
    </div>
  </div>

  <!-- App config & scripts -->
  <script>const API='http://localhost:8000';</script>
  <script src="js/session.js"></script>
  <script>redirectIfAuthed();</script>
  <script src="js/register.js"></script>
</body>
</html>
